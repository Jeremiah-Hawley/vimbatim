[package]
name = "vimbatim"
version = "0.1.0-beta.1"
edition = "2021"
build = "build.rs"

[[bin]]
name = "vimbatim"
path = "src/main.rs"

[dependencies]
gpui          = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit","x11", "wayland"] }
regex         = "1"
quick-xml     = "0.30"
zip           = "2"
spellbook = "0.4.2"

[dev-dependencies]
# Verifies the bundled font faces actually register under one consistent
# family name with distinct weight/style — see main.rs's
# test_bundled_fonts_register_as_one_family_with_four_distinct_faces.
ttf-parser = "0.25"

# cargo-bundle (closed_beta_plan.md §1) reads this to build Vimbatim.app on
# macOS. `icon` is deliberately omitted — no .icns exists in the repo yet;
# cargo-bundle falls back to a generic app icon until one is added.
# `resources` copies the bundled defaults into Contents/Resources/ — without
# it, cargo-bundle never creates a Resources dir at all (no cp target to
# copy into after the fact).
#
# Only default_settings.conf ships. The user's own settings.conf is no longer
# read from the bundle at all: it lives in the per-user data directory and is
# seeded from this file on first launch (src/state.rs's `ensure_settings_file`),
# because a bundle is read-only under Gatekeeper translocation and writing into
# one breaks its code signature.
[package.metadata.bundle]
name = "Vimbatim"
identifier = "com.vimbatim.app"
short_description = ".docx editor for collegiate policy debate"
resources = ["default_settings.conf"]

# cargo-generate-rpm (closed_beta_plan_5platforms.md §1) builds the Fedora
# .rpm from these assets after `cargo build --release` — no hand-written
# .spec file. default_settings.conf ships into /usr/bin/ alongside the
# binary (not /usr/share/) so state.rs's bundled_default_settings_path()
# finds it via its existing "beside current_exe()" lookup with zero Rust
# changes — see the plan doc for why that's an acceptable non-FHS tradeoff
# for a closed beta.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/vimbatim", dest = "/usr/bin/vimbatim", mode = "755" },
    { source = "default_settings.conf", dest = "/usr/bin/default_settings.conf", mode = "644" },
]
